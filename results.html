<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>JurisTopic - Search</title>
        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Google Fonts: Poppins -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>
    
        <!-- Tailwind Configuration -->
        <script src="tailwind-config.js"></script>
    
        <!-- Custom CSS -->
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="page-container">
            <main class="main-container">
                <header class="site-header">
                    <a href="search.html" class="site-logo-link">
                        <h1 class="site-logo">
                            <span class="secondary-color">Juris</span>
                            <span class="primary-color -ml-3">Topic</span>
                        </h1>
                    </a>
                    <p class="text-sm sm:text-base mt-1">
                        A Smarter Way to Explore Philippine Legal Topics
                    </p>
                </header>
                <!-- Topic Hierarchy Card -->
                <section class="topic-hierarchy-card">
                    <h2 class="secondary-color text-lg sm:text-xl md:text-2xl font-semibold">
                        Topic Hierarchy
                    </h2>
                    <div class="topic-hierarchy-container">
                        <div class="topic-details-wrapper">
                            <details open class="group">
                                <summary class="topic-summary">
                                    <div class="flex items-center gap-3">
                                        <svg 
                                            xmlns="http://www.w3.org/2000/svg" 
                                            class="chevron h-5 w-5 text-brand-gray-text transition-transform duration-200" 
                                            viewBox="0 0 20 20" fill="currentColor"
                                        >
                                            <path 
                                                fill-rule="evenodd" 
                                                d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" 
                                                clip-rule="evenodd" 
                                            />
                                        </svg>
                                        <img 
                                            src="src/doc_icon.svg" 
                                            alt="How it works icon" 
                                            class="h-6 w-6" 
                                        />
                                        <span 
                                            class="topic-title text-lg font-semibold text-brand-gray" 
                                            data-topic="{{topic_name}}"
                                        >
                                            {{topic_name}}
                                        </span>
                                    </div>
                                </summary>
                                <!-- Keywords for Closest Topic -->
                                <div class="topwords-container">
                                    {% for word in top_words %}
                                    <span class="topwords">
                                        {{ word }}
                                    </span>
                                    {% endfor %}
                                </div>
                            </details>
                        </div>
                    </div>
                </section>
                <!-- Relevant Documents Card -->
                <section id="relevant-docs" class="relevant-docs-card" data-show="">
                    <h2 class="text-2xl font-semibold text-brand-gray">
                        Relevant Documents for 
                        <span class="primary-color">
                            {{topic_name}}
                        </span>
                    </h2>
                    <div class="flex flex-col divide-y divide-brand-gray-border">
                        {% for doc in rep_docs %}
                        <div class="py-3 sm:py-4">
                            <p class="text-xs sm:text-sm text-brand-gray-text">
                                {{ doc.case_number }}
                            </p>
                            <a 
                                href="{{ doc.case_link }}" 
                                class="text-sm sm:text-base md:text-lg font-medium text-brand-blue hover:underline block mt-1" 
                                target="_blank"
                            >
                                {{ doc.case_title }}
                            </a>
                        {% endfor %}
                        </div>
                    </div>
                </section>
                <!--Start a New Search Button-->
                <footer class="mt-2 sm:mt-4">
                    <a 
                        href="/" 
                        class="footer-action-btn"
                    >
                        <svg 
                            xmlns="http://www.w3.org/2000/svg" 
                            class="h-4 w-4 sm:h-5 sm:w-5" 
                            viewBox="0 0 20 20" 
                            fill="currentColor"
                        >
                            <path 
                                fill-rule="evenodd" 
                                d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" 
                                clip-rule="evenodd" 
                            />
                        </svg>
                        Start a New Search
                    </a>
                </footer>
            </main>
        </div>
        <script>
            const summaries = document.querySelectorAll('summary');
            const docsSection = document.getElementById('relevant-docs');
            const topicLabel = docsSection.querySelector('span.text-brand-blue');

            summaries.forEach(summary => {
                summary.addEventListener('click', (e) => {
                    const isChevron = e.target.closest('.chevron');

                    if (!isChevron) {
                        e.preventDefault(); 
        
                        const topicSpan = summary.querySelector('.topic-title');
                        if (topicSpan) {
                            const selectedTopic = topicSpan.dataset.topic;
                            topicLabel.textContent = selectedTopic;
                            docsSection.classList.remove('hidden');
                            docsSection.scrollIntoView({ behavior: 'smooth' });
                        }
                    }
                });
                const summaries = document.querySelectorAll('summary');
                summary.addEventListener('click', (e) => {
                    const isChevron = e.target.closest('.chevron');
                    if (!isChevron) {
                        e.preventDefault();
                    }
                });
            });
        </script>
    </body>
</html>
