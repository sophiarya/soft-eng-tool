<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JurisTopic – Semantic Topic Hierarchy</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #f5f3ff 0%, #f0f1ff 40%, #ffffff 100%);
      color: #555;
      margin: 0;
      overflow: hidden;
    }

    #main-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: 100%;
      cursor: grab;
      display: block;
    }

    .link {
      fill: none;
      stroke-width: 2.8px;
      stroke-opacity: 0.9;
      filter: drop-shadow(0 0 3px rgba(138, 77, 255, 0.3));
    }

    .node circle {
      fill: #8A94FF;
      stroke: #4c0099;
      stroke-width: 2px;
      cursor: pointer;
      transition: fill 0.25s;
      filter: drop-shadow(0 1.5px 1px rgba(0, 0, 0, 0.08));
    }

    .node circle:hover {
      fill: #4500e2;
      filter: drop-shadow(0 1.5px 3px rgba(0, 0, 0, 0.2));
    }

    .tooltip {
      position: absolute;
      padding: 6px 10px;
      background: #1E1B39;
      color: #FFF;
      border: 1px solid #C9CEFF;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      max-width: 280px;
      z-index: 10;
    }

    .search-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
      padding: 8px 12px;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 13;
      min-width: 250px;
    }

    .search-bar.active {
      display: flex;
    }

    .search-bar input {
      flex: 1;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      font-family: 'Poppins', sans-serif;
    }

    .search-bar input:focus {
      border-color: #4a3aff;
    }

    .search-bar button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #666;
      font-size: 16px;
      line-height: 1;
    }

    .search-bar button:hover {
      color: #333;
    }

    .search-results-info {
      font-size: 11px;
      color: #666;
      white-space: nowrap;
    }

    .zoom-controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      z-index: 12;
      transition: top 0.3s ease;
    }

    .search-bar.active ~ .zoom-controls {
      top: 60px;
    }

    .zoom-controls button {
      display: block;
      width: 40px;
      height: 40px;
      border: none;
      background: white;
      font-size: 18px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .zoom-controls button:hover {
      background: #f5f5f5;
    }

    .highlight-match circle {
      fill: #FFD700 !important;
      stroke: #FFA500 !important;
      stroke-width: 3px !important;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8)) !important;
    }

    .keyword-highlight {
      fill: #FFD700;
      opacity: 0.8;
    }

    .label-bg {
      fill: #FFF;
      stroke: #C9CEFF;
      stroke-width: 1px;
      rx: 4;
      ry: 4;
      filter: drop-shadow(0 1.5px 1px rgba(0, 0, 0, 0.08));
      transition: all 0.25s ease;
    }

    .label-text {
      font-size: 13px;
      fill: #333;
    }

    .label-group:hover .label-bg {
      fill: #f0f1ff;
    }

    #right-panel {
    position: absolute;
    top: 0;
    right: 0;
    width: 400px; 
    height: 100%;
    background: #fff;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    padding: 0.5rem 2rem 2rem;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.4s ease;
    z-index: 15;
    display: flex;
    flex-direction: column;
    }

    #right-panel.active {
    transform: translateX(0);
    }

    #close-panel {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    font-size: 1.6rem;
    font-weight: bold;
    cursor: pointer;
    color: #999;
    transition: color 0.2s;
    }

    #close-panel:hover {
    color: #333;
    }

    #right-panel h3 {
    font-size: 1.5rem;
    color: #333;
    margin-bottom: 1rem;
    line-height: 1.3;
    }

    .primary-color {
    color: #4a3aff;
    }

    #relevant-docs-list {
    display: flex;
    flex-direction: column;
    border-top: 1px solid #eee;
    margin-top: 1rem;
    padding-top: 1rem;
    }

    #relevant-docs-list div {
    padding: 0.8rem 0;
    border-bottom: 1px solid #eee;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.5rem;
    }

    #relevant-docs-list div:first-child {
    padding-top: 0;
    }

    #relevant-docs-list p {
    margin: 0;
    }

    .doc-probability {
    font-size: 0.75rem;
    color: #5b5fa6;
    font-weight: 500;
    }

    #top-words-section {
    margin-bottom: 1.5rem;
    }

    #top-words-section h4 {
    margin: 0 0 0.75rem 0;
    font-size: 1rem;
    color: #444;
    }

    #top-words-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    }

    #probability-summary {
    display: none;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1rem;
    font-size: 0.9rem;
    color: #434168;
    font-weight: 600;
    }

    .probability-label {
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-size: 0.75rem;
    color: #6d6aa6;
    }

    .probability-badge {
    padding: 0.3rem 0.75rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    border: 1px solid transparent;
    background: rgba(92, 95, 166, 0.08);
    color: #4a3aff;
    }

    .probability-green {
    color: #0f7a4f;
    background: rgba(15, 122, 79, 0.12);
    border-color: rgba(15, 122, 79, 0.35);
    }

    .probability-yellow {
    color: #9c6f1f;
    background: rgba(255, 201, 84, 0.18);
    border-color: rgba(236, 179, 71, 0.35);
    }

    .probability-red {
    color: #a23a3a;
    background: rgba(223, 77, 77, 0.18);
    border-color: rgba(223, 77, 77, 0.35);
    }

    .probability-low {
    color: #555;
    background: rgba(85, 85, 85, 0.08);
    border-color: rgba(85, 85, 85, 0.25);
    }

    .top-word-chip {
    display: inline-block;
    padding: 0.35rem 0.6rem;
    background: #eef0ff;
    border: 1px solid #c9ceff;
    border-radius: 999px;
    font-size: 0.8rem;
    color: #4a3aff;
    }

    #relevant-docs-list a {
    text-decoration: none;
    color: #0055ff;
    font-weight: 500;
    font-size: 0.9rem;
    }

    #relevant-docs-list a:hover {
    text-decoration: underline;
    }

    .no-docs {
    color: #777;
    font-size: 0.9rem;
    padding-top: 1rem;
    }

    /* === Responsive Sizes === */
    @media (max-width: 1440px) {
        #right-panel {
            width: 280px;
            padding: 1.25rem 1.75rem 1.75rem;
        }
    }

    @media (max-width: 1280px) {
        #right-panel {
            width: 260px;
            padding: 1.1rem 1.5rem 1.5rem;
        }
        #right-panel h3 {
            font-size: 0.95rem;
        }
    }

    @media (max-width: 1024px) {
        #right-panel {
            width: 230px;
            padding: 1rem 1.25rem 1.25rem;
        }
        #right-panel h3 {
            font-size: 0.9rem;
        }
    }

    @media (max-width: 768px) {
        #right-panel {
            width: 200px;
            padding: 0.85rem 1rem 1rem;
        }
        #right-panel h3 {
            font-size: 0.85rem;
        }
        #relevant-docs-list a {
            font-size: 0.85rem;
        }
    }

    @media (max-width: 500px) {
        #right-panel {
            width: 100%;
            height: 60%;
            bottom: 0;
            top: auto;
            border-radius: 16px 16px 0 0;
            transform: translateY(100%);
            padding: 0.75rem 1rem 1.1rem;
        }
        #right-panel.active {
            transform: translateY(0);
        }
        #close-panel {
            top: 8px;
            right: 14px;
        }
    }
  </style>
</head>

<body>
  <div id="main-container">
    <div class="search-bar" id="search-bar">
      <input type="text" id="search-input" placeholder="Search topics..." />
      <span class="search-results-info" id="search-results-info"></span>
      <button id="search-close" title="Close search (Esc)">&times;</button>
    </div>
    <div class="zoom-controls">
      <button id="zoom_in">+</button>
      <button id="zoom_out">−</button>
    </div>
    <div id="tooltip" class="tooltip"></div>
    <svg id="dendrogram"></svg>
    <aside id="right-panel">
      <button id="close-panel">&times;</button>
      <section id="relevant-docs" class="relevant-docs-card">
        <h3>
          Relevant Documents for
          <span class="primary-color" id="selected-topic-label">—</span>
        </h3>
        <div id="top-words-section">
          <h4>Top Words</h4>
          <div id="top-words-list">
            <p class="no-docs">Select a topic to view top words.</p>
          </div>
        </div>
        <div id="probability-summary">
          <span class="probability-label">Average Probability</span>
          <span id="probability-value" class="probability-badge">—</span>
        </div>
        <div id="relevant-docs-list">
          <p class="no-docs">Select a topic to view related documents.</p>
        </div>
      </section>
    </aside>
  </div>

  <script>
    const tooltip = d3.select("#tooltip");
    const rightPanel = document.getElementById("right-panel");
    const closePanelBtn = document.getElementById("close-panel");
    const topicLabel = document.getElementById("selected-topic-label");
    const docsList = document.getElementById("relevant-docs-list");
    const topWordsList = document.getElementById("top-words-list");
    const probabilitySummary = document.getElementById("probability-summary");
    const probabilityValue = document.getElementById("probability-value");

    const topicCasesById = new Map();
    const normalizeText = (value) => (typeof value === "string" ? value.trim() : "");

    closePanelBtn.addEventListener("click", () => {
      rightPanel.classList.remove("active");
    });

    // === Custom Search Functionality ===
    const searchBar = document.getElementById("search-bar");
    const searchInput = document.getElementById("search-input");
    const searchClose = document.getElementById("search-close");
    const searchResultsInfo = document.getElementById("search-results-info");

    let allNodes = [];
    let matchingNodes = [];
    let currentMatchIndex = -1;

    // Handle Ctrl/Cmd+F to show custom search
    document.addEventListener("keydown", (e) => {
      // Check for Ctrl+F (Windows/Linux) or Cmd+F (Mac)
      if ((e.ctrlKey || e.metaKey) && e.key === "f") {
        e.preventDefault();
        searchBar.classList.add("active");
        searchInput.focus();
        searchInput.select();
      }

      // Handle Escape to close search
      if (e.key === "Escape" && searchBar.classList.contains("active")) {
        closeSearch();
      }

      // Handle Enter to navigate to next result
      if (e.key === "Enter" && searchBar.classList.contains("active") && matchingNodes.length > 0) {
        e.preventDefault();
        if (e.shiftKey) {
          navigateToPreviousMatch();
        } else {
          navigateToNextMatch();
        }
      }
    });

    // Close search bar
    searchClose.addEventListener("click", closeSearch);

    function closeSearch() {
      searchBar.classList.remove("active");
      searchInput.value = "";
      clearHighlights();
      searchResultsInfo.textContent = "";
      matchingNodes = [];
      currentMatchIndex = -1;
    }

    // Search input handler
    searchInput.addEventListener("input", (e) => {
      const query = e.target.value.trim().toLowerCase();

      if (!query) {
        clearHighlights();
        searchResultsInfo.textContent = "";
        matchingNodes = [];
        currentMatchIndex = -1;
        return;
      }

      performSearch(query);
    });

    function performSearch(query) {
      clearHighlights();
      matchingNodes = [];

      // Search through all nodes
      allNodes.forEach(nodeData => {
        const topicName = nodeData.data.name || "";
        const topWords = Array.isArray(nodeData.data.top_words) ? nodeData.data.top_words : [];

        // Check if topic name matches
        const nameMatches = topicName.toLowerCase().includes(query);

        // Check if any top word matches
        const wordMatches = topWords.some(word =>
          word.toLowerCase().includes(query)
        );

        if (nameMatches || wordMatches) {
          matchingNodes.push({
            node: nodeData,
            matchesName: nameMatches,
            matchesWords: wordMatches
          });
        }
      });

      // Update UI with results
      if (matchingNodes.length > 0) {
        currentMatchIndex = 0;
        highlightMatches();
        updateSearchInfo();
        focusOnMatch(0);
      } else {
        searchResultsInfo.textContent = "No matches";
        currentMatchIndex = -1;
      }
    }

    function highlightMatches() {
      const query = searchInput.value.trim().toLowerCase();

      matchingNodes.forEach(matchData => {
        const nodeData = matchData.node;
        const nodeElement = d3.select(`#node-${nodeData.data.id}`);
        if (!nodeElement.empty()) {
          // Add yellow ring to circle
          nodeElement.classed("highlight-match", true);

          // Highlight matching text in label only if the name matches
          if (matchData.matchesName) {
            const labelGroup = nodeElement.select(".label-group");
            if (!labelGroup.empty()) {
              highlightTextInLabel(labelGroup, nodeData.data.name, query);
            }
          }
        }
      });
    }

    function highlightTextInLabel(labelGroup, text, query) {
      const textElement = labelGroup.select(".label-text");
      if (textElement.empty() || !text || !query) return;

      const lowerText = text.toLowerCase();
      const matchIndex = lowerText.indexOf(query);

      if (matchIndex === -1) return;

      // Get the bounding box of the text element
      const textNode = textElement.node();
      const textBBox = textNode.getBBox();

      // Calculate the position and width of the matching substring
      const beforeText = text.substring(0, matchIndex);
      const matchText = text.substring(matchIndex, matchIndex + query.length);

      // Create temporary text elements to measure widths with start anchor for accurate measurement
      const tempBefore = labelGroup.append("text")
        .attr("class", "label-text")
        .attr("text-anchor", "start")
        .attr("alignment-baseline", "middle")
        .text(beforeText);

      const tempMatch = labelGroup.append("text")
        .attr("class", "label-text")
        .attr("text-anchor", "start")
        .attr("alignment-baseline", "middle")
        .text(matchText);

      const beforeWidth = beforeText ? tempBefore.node().getBBox().width : 0;
      const matchWidth = tempMatch.node().getBBox().width;

      // Remove temporary elements
      tempBefore.remove();
      tempMatch.remove();

      // Create highlight rectangle
      // Since text-anchor is "end", text flows left-to-right starting from textBBox.x
      const highlightX = textBBox.x + beforeWidth - 3;
      const highlightY = textBBox.y - 1;
      const highlightWidth = matchWidth + 6;
      const highlightHeight = textBBox.height + 2;

      // Insert highlight rect before the text
      labelGroup.insert("rect", ".label-text")
        .attr("class", "keyword-highlight")
        .attr("x", highlightX)
        .attr("y", highlightY)
        .attr("width", highlightWidth)
        .attr("height", highlightHeight)
        .attr("rx", 3)
        .attr("ry", 3);
    }

    function clearHighlights() {
      d3.selectAll(".node").classed("highlight-match", false);
      d3.selectAll(".keyword-highlight").remove();
    }

    function updateSearchInfo() {
      if (matchingNodes.length > 0) {
        searchResultsInfo.textContent = `${currentMatchIndex + 1} / ${matchingNodes.length}`;
      } else {
        searchResultsInfo.textContent = "";
      }
    }

    function navigateToNextMatch() {
      if (matchingNodes.length === 0) return;
      currentMatchIndex = (currentMatchIndex + 1) % matchingNodes.length;
      updateSearchInfo();
      focusOnMatch(currentMatchIndex);
    }

    function navigateToPreviousMatch() {
      if (matchingNodes.length === 0) return;
      currentMatchIndex = (currentMatchIndex - 1 + matchingNodes.length) % matchingNodes.length;
      updateSearchInfo();
      focusOnMatch(currentMatchIndex);
    }

    function focusOnMatch(index) {
      if (index < 0 || index >= matchingNodes.length) return;

      const matchData = matchingNodes[index];
      const nodeData = matchData.node;
      const svg = d3.select("#dendrogram");
      const g = svg.select("g");

      // Get the current transform
      const currentTransform = d3.zoomTransform(svg.node());

      // Calculate new position to center the node
      const width = 2200;
      const height = 1600;
      const scale = currentTransform.k;

      const x = nodeData.y;
      const y = nodeData.x;

      const newX = width / 2 - x * scale;
      const newY = height / 2 - y * scale;

      // Animate to the new position
      const zoom = d3.zoom();
      svg.transition()
        .duration(500)
        .call(zoom.transform, d3.zoomIdentity.translate(newX, newY).scale(scale));
    }
  
    Promise.all([
      d3.json("../static/topic_hierarchy_v2.json"),
      d3.csv("../static/sc_cases_truncated_final_refit.csv", row => {
        const probability = parseFloat(row.probability);
        return {
          topic: normalizeText(row.topic),
          case_number: normalizeText(row.case_number),
          case_title: normalizeText(row.case_title),
          case_link: normalizeText(row.case_link),
          probability: Number.isFinite(probability) ? probability : undefined
        };
      })
    ]).then(([data, csvRows]) => {
      const aggregatedDocs = new Map();
      csvRows.forEach(row => {
        const topicId = row.topic;
        if (!topicId) return;
        const topicNumber = Number(topicId);
        if (!Number.isFinite(topicNumber) || topicNumber < 1 || topicNumber > 64) return;
        if (!Number.isFinite(row.probability) || row.probability === 0) return;
        const entry = {
          case_number: row.case_number,
          case_title: row.case_title,
          case_link: row.case_link,
          probability: row.probability
        };
        if (!aggregatedDocs.has(topicId)) {
          aggregatedDocs.set(topicId, []);
        }
        aggregatedDocs.get(topicId).push(entry);
      });

      aggregatedDocs.forEach((docs, topicId) => {
        const filteredDocs = docs.filter(doc => Number.isFinite(doc.probability) && doc.probability !== 0);
        if (filteredDocs.length === 0) return;
        filteredDocs.sort((a, b) => b.probability - a.probability);
        const average = filteredDocs.reduce((total, doc) => total + doc.probability, 0) / filteredDocs.length;
        const averagePercent = average * 100;
        const percentDocs = filteredDocs.map(doc => ({
          ...doc,
          probabilityPercent: doc.probability * 100
        }));
        const docCount = percentDocs.length;
        topicCasesById.set(topicId, { docs: percentDocs, averagePercent, docCount });
      });

      const width = 2200;
      const height = 1600;
  
      const svg = d3.select("#dendrogram").attr("viewBox", [0, 0, width, height]);
      const g = svg.append("g");
  
      const zoom = d3.zoom()
        .scaleExtent([0.4, 2.5])
        .on("zoom", (event) => g.attr("transform", event.transform));
      svg.call(zoom);
  
      d3.select("#zoom_in").on("click", () => svg.transition().call(zoom.scaleBy, 1.2));
      d3.select("#zoom_out").on("click", () => svg.transition().call(zoom.scaleBy, 0.8));
  
      const root = d3.hierarchy(data);
      computeClusterAggregates(root);
      const tree = d3.cluster().size([height - 200, width - 800]).separation((a, b) => (a.parent === b.parent ? 6 : 8));
      tree(root);
  
      root.descendants().forEach(d => d.y = width - d.y - 600);
  
      const topAncestors = root.children ? root.children.map(d => d.data.name) : [root.data.name];
      const colorScale = d3.scaleOrdinal().domain(topAncestors).range(d3.schemeTableau10);
  
      function getTopAncestor(d) {
        let n = d;
        while (n.depth > 1) n = n.parent;
        return n.data.name;
      }
  
      const elbow = d => `M${d.source.y},${d.source.x}V${d.target.x}H${d.target.y}`;
  
      g.selectAll(".link")
        .data(root.links())
        .join("path")
        .attr("class", "link")
        .attr("d", elbow)
        .attr("stroke", d => colorScale(getTopAncestor(d.target)));
  
      // Store all nodes for search functionality
      allNodes = root.descendants();

      const node = g.selectAll(".node")
        .data(allNodes)
        .join("g")
        .attr("class", "node")
        .attr("id", d => `node-${d.data.id}`)
        .attr("transform", d => `translate(${d.y},${d.x})`)
        .on("mouseover", (event, d) => {
          if (d.depth === 0) return;
          tooltip.style("opacity", 1)
            .html(`<strong>${d.data.name}</strong>`)
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 10) + "px");
        })
        .on("mousemove", (event, d) => {
          if (d.depth === 0) return;
          tooltip.style("left", (event.pageX + 10) + "px").style("top", (event.pageY - 10) + "px");
        })
        .on("mouseout", (event, d) => {
          if (d.depth === 0) return;
          tooltip.style("opacity", 0);
        })
        .on("click", (event, d) => {
          if (d.depth === 0) return;
          showRelevantDocs(d.data);
        });
  
      node.filter(d => d.depth > 0)
        .append("circle")
        .attr("r", 6)
        .attr("fill", d => colorScale(getTopAncestor(d)))
        .style("filter", "drop-shadow(0 0 6px rgba(118, 93, 255, 0.45))")
        .style("transition", "all 0.25s ease");
  
      const labels = node.filter(d => !d.children)
        .append("g")
        .attr("class", "label-group")
        .attr("transform", "translate(-16,0)");
  
      labels.append("rect").attr("class", "label-bg");
      labels.append("text")
        .attr("class", "label-text")
        .attr("text-anchor", "end")
        .attr("alignment-baseline", "middle")
        .text(d => d.data.name);
  
      labels.each(function () {
        const text = d3.select(this).select("text");
        const rect = d3.select(this).select("rect");
        const bbox = text.node().getBBox();
        rect.attr("x", bbox.x - 6)
          .attr("y", bbox.y - 2)
          .attr("width", bbox.width + 12)
          .attr("height", bbox.height + 4)
          .attr("rx", 20)
          .attr("ry", 20);
      });
  
      const bounds = g.node().getBBox();

      // Calculate minimum zoom to fit the full height of the dendrogram
      const minZoomScale = height / bounds.height;

      // Update zoom scale extent with the calculated minimum
      zoom.scaleExtent([minZoomScale * 0.95, 2.5]);

      const scale = Math.min(1.2, Math.max(minZoomScale, 1 / Math.max(bounds.width / width, bounds.height / height)));
      const translateX = width / 2 - scale * (bounds.x + bounds.width / 2);
      const translateY = height / 2 - scale * (bounds.y + bounds.height / 2);

      svg.call(zoom.transform, d3.zoomIdentity.translate(translateX, translateY).scale(scale));
    }).catch(error => {
      console.error("Failed to load dendrogram data:", error);
    });

    function getProbabilityBadgeClass(value) {
      if (value > 80) return "probability-green";
      if (value > 50) return "probability-yellow";
      if (value > 30) return "probability-red";
      return "probability-low";
    }

    function formatPercentage(value) {
      if (!Number.isFinite(value)) return "0";
      return value.toFixed(4).replace(/\.?0+$/, "");
    }

    function setProbabilitySummary(averagePercent) {
      if (!Number.isFinite(averagePercent)) {
        probabilitySummary.style.display = "none";
        probabilityValue.textContent = "—";
        probabilityValue.className = "probability-badge";
        return;
      }
      probabilityValue.textContent = `${formatPercentage(averagePercent)}%`;
      probabilityValue.className = `probability-badge ${getProbabilityBadgeClass(averagePercent)}`;
      probabilitySummary.style.display = "flex";
    }

    function computeClusterAggregates(node) {
      if (!node) return null;
      const nodeIdRaw = node?.data?.id;
      const nodeId = nodeIdRaw != null ? String(nodeIdRaw).trim() : null;
      let stats = nodeId ? topicCasesById.get(nodeId) : null;

      let totalDocs = 0;
      let weightedSum = 0;

      (node.children || []).forEach(child => {
        const childStats = computeClusterAggregates(child);
        if (!childStats) return;
        const childDocCount = Number(childStats.docCount) || 0;
        const childAverage = childStats.averagePercent;
        if (!Number.isFinite(childAverage) || childDocCount <= 0) return;
        totalDocs += childDocCount;
        weightedSum += childAverage * childDocCount;
      });

      if (totalDocs > 0) {
        const combinedAverage = weightedSum / totalDocs;
        const docsArray = stats && Array.isArray(stats.docs) ? stats.docs : [];
        stats = {
          docs: docsArray,
          averagePercent: combinedAverage,
          docCount: totalDocs
        };
      }

      if (stats && nodeId) {
        topicCasesById.set(nodeId, stats);
        return stats;
      }

      if (nodeId && topicCasesById.has(nodeId)) {
        return topicCasesById.get(nodeId);
      }

      return null;
    }
  
    function showRelevantDocs(topicData) {
      const topicName = topicData?.name ?? "—";
      topicLabel.textContent = topicName;

      const topWords = Array.isArray(topicData?.top_words) ? topicData.top_words : [];
      topWordsList.innerHTML = "";
      if (topWords.length > 0) {
        topWords.forEach(word => {
          const span = document.createElement("span");
          span.className = "top-word-chip";
          span.textContent = word;
          topWordsList.appendChild(span);
        });
      } else {
        topWordsList.innerHTML = `<p class="no-docs">No top words available for this topic.</p>`;
      }

      const topicId = topicData?.id != null ? String(topicData.id).trim() : "";
      const topicStats = topicCasesById.get(topicId);
      const useCsvDocs = topicStats && Array.isArray(topicStats.docs) && topicStats.docs.length > 0;

      docsList.innerHTML = "";
      if (useCsvDocs) {
        const docs = topicStats.docs.slice(0, 15);
        docs.forEach(doc => {
          const div = document.createElement("div");
          div.innerHTML = `
            <p class="text-xs text-brand-gray-text">${doc.case_number}</p>
            <a href="${doc.case_link}" target="_blank">${doc.case_title}</a>
          `;
          docsList.appendChild(div);
        });
      } else {
        const docs = Array.isArray(topicData?.representative_docs) ? topicData.representative_docs : [];
        if (docs && docs.length > 0) {
          docs.forEach(doc => {
            const div = document.createElement("div");
            div.innerHTML = `
              <p class="text-xs text-brand-gray-text">${doc.case_number}</p>
              <a href="${doc.case_link}" target="_blank">${doc.case_title}</a>
            `;
            docsList.appendChild(div);
          });
        } else {
          docsList.innerHTML = `<p class="no-docs">No representative documents available for this topic.</p>`;
        }
      }

      const summaryValue = Number.isFinite(topicStats?.averagePercent) ? topicStats.averagePercent : undefined;
      setProbabilitySummary(summaryValue);

      rightPanel.classList.add("active");
    }
  </script>
