<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>JurisTopic - Search</title>
        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Google Fonts: Poppins -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Tailwind Configuration -->
        <script src="tailwind-config.js"></script>

        <!-- Custom CSS -->
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="page-container">
            <main class="main-container">
                <!-- Header -->
                <header class="site-header">
                    <a href="search.html" class="site-logo-link">
                        <h1 class="site-logo">
                            <span class="secondary-color">Juris</span>
                            <span class="primary-color -ml-3">Topic</span>
                        </h1>
                    </a>
                    <p class="text-sm sm:text-base mt-1">
                        A Smarter Way to Explore Philippine Legal Topics
                    </p>
                </header>
                <!-- Search Card -->
                <section class="search-card">
                    <form 
                        id="search-form" 
                        action="/search" 
                        method="post"
                    >
                        <label for="search-query" class="sr-only">
                            Search Query
                        </label>
                        <textarea 
                            id="search-query" 
                            name="search_term" 
                            rows="4" 
                            placeholder="Enter a search phrase or keyword..."
                            required
                            class="text-sm sm:text-base md:text-lg"
                        ></textarea>
                        <div class="button-container">
                            <button type="submit" id="search-btn">
                                <span 
                                    id="search-btn-text" 
                                    class="text-sm sm:text-base md:text-lg"
                                >
                                    Search Topics
                                </span>
                                <span id="search-btn-loading" class="hidden">
                                    <div class="spinner"></div>
                                </span>
                            </button>
                        </div>
                    </form>
                </section>
                <!-- Dendogram Section -->
                <section class="dendogram-section">
                    <div class="dendogram-header">
                        <div class="flex-shrink-0 mt-0.5 sm:mt-0">
                            <img 
                                src="src\doc_icon.svg" 
                                alt="How it works icon" 
                                class="h-6 w-6 sm:h-8 sm:w-8 md:h-9 md:w-9" 
                            />
                        </div>
                        <div>
                            <h2 class="text-lg sm:text-md md:text-2xl font-semibold leading-tight">
                                <span class="secondary-color">
                                    See How Juris
                                    <span class="primary-color -ml-1">Topic</span> 
                                    Works
                                </span>
                            </h2>
                            <p class="text-sm sm:text-base mt-1">
                                Explore our topic modeling visualization with sample legal data
                            </p>
                        </div>
                    </div>
                    <!-- Visualization Container -->
                    <div class="dendogram-container">
                        <iframe 
                            src="src/topic_hierarchy.html" 
                            class="w-full h-[600px] border-0 custom-scroll" 
                            scrolling="yes"
                        ></iframe>
                    </div>               
                    <!-- Legend -->
                    <div class="legend-container">
                        <div class="legend-item">
                            <div class="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-brand-gray rounded-full flex-shrink-0"></div>
                            <span>Merged Topics</span>
                        </div>
                        <div class="legend-item">
                            <div class="w-8 sm:w-10 h-px bg-brand-gray flex-shrink-0"></div>
                            <span>Hierarchical relationships</span>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </body>
    <script>
        document.getElementById('search-form').addEventListener('submit', function() {
            var btn = document.getElementById('search-btn');
            var btnText = document.getElementById('search-btn-text');
            var btnLoading = document.getElementById('search-btn-loading');
            btnText.classList.add('hidden');
            btnLoading.classList.remove('hidden');
            btn.disabled = true;
        });
    </script>
</html>
